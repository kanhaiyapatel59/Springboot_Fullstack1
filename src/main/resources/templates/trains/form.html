<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Train Form</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <h1 th:text="${train.id} != null ? 'Edit Train' : 'Add Train'"></h1>
    <form th:action="@{${train.id} != null ? '/trains/update/' + ${train.id} : '/trains'}" 
          th:object="${train}" method="post">
        <label>Name:</label>
        <input type="text" th:field="*{name}" required/><br/>

        <label>Source:</label>
        <input type="text" th:field="*{source}" required/><br/>

        <label>Destination:</label>
        <input type="text" th:field="*{destination}" required/><br/>

        <label>Base Price:</label>
        <input type="number" step="0.01" th:field="*{basePrice}" required/><br/>

        <label>Discount (%):</label>
        <input type="number" step="0.01" th:field="*{discountPercentage}" /><br/>

        <button type="submit">Submit</button>
    </form>
    <a href="/trains">Back to Train List</a>
</body>
</html>
